<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
      :root {
          --font: Helvetica, Inter, sans-serif;
          --bg: #111;
      }
      body {
          min-width: 40em;
          padding: 0.25em;
          font-family: var(--font);
          background-color: var(--bg);
          color: white;
      }
      .vcontainer {
          display: flex;
          flex-direction: column;
          gap: 0.25em;
          font-size: 1em;
      }
      .hcontainer {
          display: flex;
          flex-direction: row;
          gap: 0.25em;
          height: 2em;
      }
      textarea {
          width: 100%;
          min-height: 8em;
          min-width: 32em;
          resize: both;
          padding: 0.125em 0.25em;
          box-sizing: border-box;
          background-color: var(--bg);
          color: white;
          font-family: var(--font);
          outline: none;
          box-shadow: none;
          border-top: 0.2rem solid #000000;
          border-left: 0.2rem solid #000000;
          border-bottom: 0.2rem solid #2e2e2e;
          border-right: 0.2rem solid #2e2e2e;
      }
      textarea:focus {
          outline: none;
          box-shadow: none;
          border-top: 0.15rem solid #000000;
          border-left: 0.15rem solid #000000;
          border-bottom: 0.15rem solid #2e2e2e;
          border-right: 0.15rem solid #2e2e2e;
      }
      button {
          height: 100%;
          white-space: nowrap;
          padding: 0 0.75em;
          box-sizing: border-box;
          color: #dcdcdc;
          font-family: var(--font);
          font-weight: bold;
          text-shadow: 2px 2px 0 #111;
          background-color: var(--bg);
          border-top: 0.15rem solid #2e2e2e;
          border-left: 0.15rem solid #2e2e2e;
          border-bottom: 0.15rem solid #000000;
          border-right: 0.15rem solid #000000;
          cursor: pointer;
      }
      button:hover {
          background-color: #2e2e2e;
          border-top-color: #3e3e3e;
          border-left-color: #3e3e3e;
      }
      button:active {
          background-color: var(--bg);
          border-top: 0.15rem solid #000000;
          border-left: 0.15rem solid #000000;
          border-bottom: 0.15rem solid #2e2e2e;
          border-right: 0.15rem solid #2e2e2e;
          outline: none;
      }
      .capturebutton {
          font-size: 1em;
          flex: 4 0 0;
          text-align: center;
      }
      .markdownbutton {
          flex: 1 0 0;
          text-align: center;
      }
      .portinput {
          padding: 0.125em 0.75em;
          border: none;
          border-radius: 0.125em;
          font-family: var(--font);
          box-sizing: border-box;
          cursor: text;
          background-color: var(--bg);
          color: gray;
          width: 10ch;
          text-align: center;
          font-weight: bold;
          border-top: 0.15rem solid #000000;
          border-left: 0.15rem solid #000000;
          border-bottom: 0.15rem solid #2e2e2e;
          border-right: 0.15rem solid #2e2e2e;
      }
      .portinput:focus {
          outline: none;
      }
      .capturelog {
          overflow-y: auto;
          max-height: 8em;
      }
      table {
          width: 100%;
          border-collapse: collapse;
          font-size: 0.85em;
      }
      thead th {
          position: sticky;
          top: 0;
          /* background-color: black; */
          background-color: var(--bg);
          color: #FF4000;
          text-align: left;
          vertical-align: baseline;
          padding: 0 0.5em;
          border-bottom: 0.2em solid var(--bg);
          border-right: 0.2em solid var(--bg);
          z-index: 1;
          width:1px;
      }
      tr {
          border-bottom: 0.2em solid var(--bg);
      }
      td {
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          background-color: black;
          border-right: 0.2em solid var(--bg);
          padding: 0 0.5em;
          max-width: 10vw;
      }
      td:hover {
          background-color: var(--bg);
      }
      td:last-child, th:last-child {
          border-right: none;
      }
      .capturelogrow-status-success {
          color: white;
          background-color: green;
          text-align: center;
      }
      .capturelogrow-status-error {
          color: white;
          background-color: red;
          text-align: center;
      }
      .capturelogrow-timesince {
          color: green;
          text-align: right;
          font-weight: bold;
      }
      .capturelogrow-pagetitle {
          color: orange;
          max-width: 50vw;
      }
      .capturelogrow-domain {
          color: lightblue;
          max-width: 15vw;
      }
      .capturelogrow-wordcountcontextzero, .capturelogrow-wordcountselectionzero, .capturelogrow-wordcountcontext, .capturelogrow-wordcountselection {
          text-align: right;
          font-weight: bold;
      }
      .capturelogrow-wordcountselection {
          color: pink;
      }
      .capturelogrow-wordcountcontext {
          color: lightgreen;
      }
      .capturelogrow-wordcountselectionzero {
          color: white;
          background-color: #471111;
      }
      .capturelogrow-wordcountcontextzero {
          color: white;
          background-color: #471111;
      }
      .portinput::-webkit-outer-spin-button,
      .portinput::-webkit-inner-spin-button {
          -webkit-appearance: none;
          margin: 0;
      }
      .portinput[type=number] {
          -moz-appearance: textfield;
      }
    </style>
  </head>
  <body>
    <div class="vcontainer">
      <div>
        <textarea id="context"></textarea>
      </div>
      <div class="hcontainer">
        <button id="capture-button" class="capturebutton">Capture</button>
        <button id="markdown-button" class="markdownbutton">MD</button>
        <input id="port-input" class="portinput" type="number" min="1" max="65535" value="18080" required>
      </div>
      <div id="capture-log" class="capturelog">
        <table id="capture-log-table" style="display: none;">
          <thead>
            <tr>
              <th title="Server Status">🤠</th>
              <th title="Time Since (hover for full time)">Time</th>
              <th title="Page Title (Hover for full title)">Page Title</th>
              <th title="Domain (Hover for URL)">Domain</th>
              <th title="Words in Selection">Sel</th>
              <th title="Words in Context">Ctx</th>
            </tr>
          </thead>
          <tbody id="capture-log-table-body"></tbody>
        </table>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
