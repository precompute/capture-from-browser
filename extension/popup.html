<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
      :root {
          --font: Helvetica, Inter, sans-serif;
          --bg: #191919;
          --c1: #21A167;
          --c1-dim: color-mix(in srgb, var(--c1) 5%, transparent);
          --c2: #971111;
          --c2-dim: color-mix(in srgb, var(--c2) 5%, transparent);
          --bw1: #2e2e2e;
          --bw2: #3e3e3e;
          --w1: 0.15rem;
          --w2: 0.25rem;
      }
      html {
          margin: 0 !important;
          padding: 0 !important;
          border-radius: 0 !important;
      }
      body {
          min-width: 40em;
          padding: 0.5em;
          margin: 0 !important;
          font-family: var(--font);
          background-color: var(--bg);
          color: white;
          border-radius: 0px !important;
      }
      .vcontainer {
          display: flex;
          flex-direction: column;
          gap: 0.25em;
          font-size: 1em;
      }
      .hcontainer {
          display: flex;
          flex-direction: row;
          gap: 0.25em;
          height: 2em;
      }
      textarea {
          width: 100%;
          min-width: 32em;
          resize: both;
          padding: 0.125em 0.25em;
          box-sizing: border-box;
          color: white;
          font-family: var(--font);
          outline: none;
          box-shadow: none;
          border-top: 0.2rem solid #000000;
          border-left: 0.2rem solid #000000;
          border-bottom: 0.2rem solid var(--bw1);
          border-right: 0.2rem solid var(--bw1);
      }
      textarea:focus {
          outline: none;
          box-shadow: none;
          background-color: black;
          border-top: 0.2rem solid #000000;
          border-left: 0.2rem solid #000000;
          border-bottom: 0.2rem solid var(--bw1);
          border-right: 0.2rem solid var(--bw1);
      }
      .textarea-context {
          background-color: var(--bg);
          min-height: 8em;
      }
      .textarea-context:hover {
          background-color: black;
      }
      .textarea-preview {
          background-color: var(--c1-dim);
          min-height: 1em;
      }
      .textarea-context:hover {
          background-color: black;
      }
      button {
          height: 100%;
          white-space: nowrap;
          padding: 0 0.75em;
          box-sizing: border-box;
          color: #dcdcdc;
          font-family: var(--font);
          font-weight: bold;
          text-shadow: 2px 2px 0 black;
          background-color: var(--bg);
          border-top: var(--w1) solid var(--bw1);
          border-left: var(--w1) solid var(--bw1);
          border-bottom: var(--w1) solid #000000;
          border-right: var(--w1) solid #000000;
          cursor: pointer;
          transition: 0.1s;
      }
      button:hover {
          background-color: var(--bw1);
          border-top-color: var(--bw2);
          border-left-color: var(--bw2);
      }
      button:active {
          background-color: var(--bg);
          border-top: var(--w1) solid #000000;
          border-left: var(--w1) solid #000000;
          border-bottom: var(--w1) solid var(--bw1);
          border-right: var(--w1) solid var(--bw1);
          outline: none;
      }
      button.enabled {
          background-color: var(--bg);
          border-top: var(--w1) solid #000000;
          border-left: var(--w1) solid #000000;
          border-bottom: var(--w1) solid var(--bw1);
          border-right: var(--w1) solid var(--bw1);
          outline: none;
      }
      .settingsbutton {
          color: var(--bw2);
          text-align: center;
      }
      .extractlinksbutton {
          text-align: center;
          display: none;
      }
      .capturebutton {
          font-size: 1em;
          flex: 1 0 0;
          text-align: center;
      }
      .markdownbutton {
          flex: 3 0 0;
          text-align: center;
      }
      .previewbutton {
          flex: 3 0 0;
          text-align: center;
      }
      .logbutton {
          flex: 3 0 0;
          text-align: center;
      }
      .portinput {
          flex: 1 0 0;
          padding: 0.125em 0.75em;
          border: none;
          font-family: var(--font);
          box-sizing: border-box;
          cursor: text;
          background-color: var(--bg);
          color: gray;
          text-align: center;
          font-weight: bold;
      }
      .portinput:focus {
          outline: none;
      }
      .capturelog {
          overflow-y: auto;
          max-height: 8em;
      }
      table {
          width: 100%;
          border-collapse: collapse;
          font-size: 0.85em;
      }
      thead th {
          position: sticky;
          top: 0;
          background-color: var(--bg);
          color: #FF4000;
          text-align: left;
          vertical-align: baseline;
          padding: 0 0.5em;
          border-bottom: 0.2em solid var(--bg);
          border-right: 0.2em solid var(--bg);
          z-index: 1;
          width: 1px;
      }
      tr {
          border-bottom: 0.2em solid var(--bg);
      }
      td {
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          background-color: black;
          border-right: 0.2em solid var(--bg);
          padding: 0 0.5em;
          max-width: 40vw;
      }
      td:hover {
          background-color: var(--bg);
      }
      td:last-child, th:last-child {
          border-right: none;
      }
      .capturelogrow-status-success {
          color: white;
          background-color: var(--c1);
          text-align: center;
      }
      .capturelogrow-status-error {
          color: white;
          background-color: red;
          text-align: center;
      }
      .capturelogrow-timesince {
          color: var(--c1);
          text-align: right;
          font-weight: bold;
      }
      .capturelogrow-pagetitle {
          color: orange;
          max-width: 50vw;
      }
      .capturelogrow-domain {
          color: lightblue;
          max-width: 15vw;
      }
      .capturelogrow-wordcountcontextzero, .capturelogrow-wordcountselectionzero, .capturelogrow-wordcountcontext, .capturelogrow-wordcountselection {
          text-align: right;
          font-weight: bold;
      }
      .capturelogrow-wordcountselection {
          color: pink;
      }
      .capturelogrow-wordcountcontext {
          color: lightgreen;
      }
      .capturelogrow-wordcountselectionzero {
          color: white;
          background-color: var(--c2);
      }
      .capturelogrow-wordcountcontextzero {
          color: white;
          background-color: var(--c2);
      }
      .portinput::-webkit-outer-spin-button,
      .portinput::-webkit-inner-spin-button {
          -webkit-appearance: none;
          margin: 0;
      }
      .portinput[type=number] {
          -moz-appearance: textfield;
      }
    </style>
  </head>
  <body>
    <div class="vcontainer">
      <div class="hcontainer">
        <button id="capture-button" class="capturebutton" title="Press C-RET or M-RET to capture.">Capture</button>
        <button id="extract-links-button" class="extractlinksbutton" title="Press C-l to insert links from current highlight to the context area.">Insert Links</button>
        <button id="settings-button" class="settingsbutton" title="Press C-s to toggle.">Settings</button>
      </div>
      <div id="settings-menu" class="hcontainer" style="display:none;">
        <button id="log-button" class="logbutton">Log</button>
        <button id="preview-button" class="previewbutton">Preview</button>
        <button id="markdown-button" class="markdownbutton">Markdown</button>
        <input id="port-input" class="portinput" type="number" min="1" max="65535" value="18080" required>
      </div>
      <div>
        <textarea id="preview" class="textarea-preview"></textarea>
      </div>
      <div>
        <textarea id="context" class="textarea-context"></textarea>
      </div>
      <div id="capture-log" class="capturelog">
        <table id="capture-log-table" style="display: none;">
          <thead>
            <tr>
              <th title="Server Status">🤠</th>
              <th title="Time Since (hover for full time)">Time</th>
              <th title="Page Title (Hover for full title)">Page Title</th>
              <th title="Domain (Hover for URL)">Domain</th>
              <th title="Words in Selection">Sel</th>
              <th title="Words in Context">Ctx</th>
            </tr>
          </thead>
          <tbody id="capture-log-table-body"></tbody>
        </table>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
