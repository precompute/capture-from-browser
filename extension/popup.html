<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
      :root {
          --font: Helvetica, Inter, sans-serif;
      }
      body {
          min-width: 10em;
          padding: 0.25em;
          padding-bottom: 0;
          font-family: var(--font);
          background-color: #050505;
          color: white;
      }
      .vcontainer {
          display: flex;
          flex-direction: column;
          gap: 0.25em;
          font-size: 1em;
      }
      .hcontainer {
          display: flex;
          flex-direction: row;
          gap: 0.25em;
          height: 2em;
      }
      textarea {
          width: 100%;
          min-height: 5em;
          min-width: 32em;
          resize: both;
          padding: 0.125em;
          box-sizing: border-box;
          background-color: black;
          color: white;
          font-family: var(--font);
          outline: none;
          border: none;
          box-shadow: none;
      }
      textarea:focus {
          outline: none;
          border: none;
          box-shadow: none;
      }
      button {
          padding: 0.125em 0.5em;
          border: none;
          cursor: pointer;
          border-radius: 0.125em;
          transition: opacity 0.1s;
          color: white;
          background-color: black;
          height: 100%;
      }
      button:hover {
          background-color: rgba(0,0,0,0);
      }
      .capturebutton {
          font-size: 1em;
          flex-grow: 4;
      }
      .markdownbutton {
          flex-grow: 1;
      }
      .portinput {
          padding: 0.125em 0.75em;
          border: none;
          border-radius: 0.125em;
          font-family: var(--font);
          box-sizing: border-box;
          cursor: text;
          background-color: black;
          color: gray;
          border: none;
          width: 10ch;
          text-align: center;
      }
      .portinput:focus {
          outline: none;

      }
      .portinput::-webkit-outer-spin-button,
      .portinput::-webkit-inner-spin-button {
          -webkit-appearance: none;
          margin: 0;
      }
      .portinput[type=number] {
          -moz-appearance: textfield;
      }
    </style>
  </head>
  <body>
    <div class="vcontainer">
      <div>
        <textarea id="context"></textarea>
      </div>
      <div class="hcontainer">
        <button id="capture-button" class="capturebutton">Capture</button>
        <button id="markdown-button" class="markdownbutton">MD</button>
        <input id="port-input" class="portinput" type="number" min="1" max="65535" value="18080" required>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
