<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
          min-width: 500px;
          padding: 2px;
          font-family: sans-serif;
      }
      .container {
          display: flex;
          flex-direction: column;
          gap: 8px;
      }

      label { font-size: 12px; font-weight: bold; color: gray; }

      textarea {
          width: 100%;
          min-height: 180px;
          resize: both;
          padding: 5px;
          box-sizing: border-box;
      }

      button {
          padding: 8px;
          border: none;
          cursor: pointer;
          font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <label for="context"></label>
        <textarea id="context"></textarea>
      </div>

      <button id="send-btn">Capture</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
