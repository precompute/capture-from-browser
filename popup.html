<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
      body {
          min-width: 10em;
          padding: 0.25em;
          font-family: sans-serif;
      }
      .vcontainer {
          display: flex;
          flex-direction: column;
          gap: 0.25em;
          font-size: 1em;
      }
      .hcontainer {
          display: flex;
          flex-direction: row;
          gap: 0.25em;
          height: 2em;
      }

      textarea {
          width: 100%;
          min-height: 10em;
          resize: both;
          padding: 0.125em;
          box-sizing: border-box;
      }

      button {
          padding: 0.125em 0.75em;
          border: none;
          cursor: pointer;
          border-radius: 0.125em;
          transition: opacity 0.1s;
          font-size: 1.25em;
          height: 100%;
          flex-grow: 4;
      }
      .statusdot {
          flex-grow: 1;
          height: 100%;
          background-color: blue;
      }
    </style>
  </head>
  <body>
    <div class="vcontainer">
      <div>
        <textarea id="context"></textarea>
      </div>
      <div class="hcontainer">
        <button id="capture-btn">Capture</button>
        <div id="status-dot" class="statusdot"></div>
    </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
